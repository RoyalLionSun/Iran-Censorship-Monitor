name: Bootstrap verified baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified v1.0.1 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz -C .
          test -f package.json
          test -f server.mjs
          test -f .env.example

      - name: Replace one-time bootstrap transport with canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified v1.0.1 source baseline'
          git push
