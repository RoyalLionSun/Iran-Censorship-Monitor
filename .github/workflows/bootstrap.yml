name: Bootstrap verified baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz -C .

      - name: Verify baseline before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          # Scan reconstructed project files only. Exclude this bootstrap workflow,
          # because the workflow itself necessarily contains the secret-name regex.
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude-dir=bootstrap \
            --exclude='bootstrap.yml' \
            --exclude='.env.example' \
            '(cfat_[A-Za-z0-9_-]+|CLOUDFLARE_RADAR_API_TOKEN=.+|GLOBALPING_API_TOKEN=.+|INTERNET_SOCIETY_PULSE_API_TOKEN=.+)' \
            .; then
            echo 'Potential credential material found.' >&2
            exit 1
          fi

      - name: Replace bootstrap transport with canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified v1.0.1 source baseline'
          git push
