name: Bootstrap verified baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verified v1.0.1 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz -C .
          test -f package.json
          test -f server.mjs
          test -f .env.example

      - name: Prepare canonical source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git restore --staged .github/workflows/bootstrap.yml 2>/dev/null || true
          git checkout -- .github/workflows/bootstrap.yml
          git status --short
          git diff --cached --quiet && { echo 'No reconstructed source changes found.' >&2; exit 1; }
          git commit -m 'Import verified v1.0.1 source baseline'

      - name: Push canonical source commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
