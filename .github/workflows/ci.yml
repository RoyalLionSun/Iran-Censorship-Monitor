name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate c00 corruption
        shell: bash
        run: |
          set -euo pipefail
          echo 'size:' $(wc -c < bootstrap-v11/c-00)
          echo prefixes
          for n in 250 500 750 1000 1500 2000 2500 3000 3500 4000 5000 6000; do printf '%s ' "$n"; head -c "$n" bootstrap-v11/c-00 | sha256sum | cut -d' ' -f1; done
          echo suffixes
          for n in 250 500 750 1000 1500 2000 2500 3000 3500 4000 5000 6000; do printf '%s ' "$n"; tail -c "$n" bootstrap-v11/c-00 | sha256sum | cut -d' ' -f1; done
