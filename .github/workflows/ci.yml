name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnose staged transport chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chunks
          split -b 4000 -d -a 1 bootstrap-v11/c-00 /tmp/chunks/c00-
          split -b 4000 -d -a 1 bootstrap-v11/r-00 /tmp/chunks/r00-
          head -c 15000 bootstrap-v11/r-03 | split -b 4000 -d -a 1 - /tmp/chunks/r03-
          echo '--- c00 ---'
          sha256sum /tmp/chunks/c00-*
          echo '--- r00 ---'
          sha256sum /tmp/chunks/r00-*
          echo '--- r03 ---'
          sha256sum /tmp/chunks/r03-*
          echo '--- repair files already staged ---'
          sha256sum bootstrap-v11/fix-* || true
