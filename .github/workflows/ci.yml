name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct staged v1.1 source
        if: ${{ hashFiles('bootstrap-v11/c-00') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            tr -d '\r\n' < bootstrap-v11/c-00
            tr -d '\r\n' < bootstrap-v11/c-01
            tr -d '\r\n' < bootstrap-v11/r-00
            tr -d '\r\n' < bootstrap-v11/r-01
            tr -d '\r\n' < bootstrap-v11/r-02
            head -c 15000 bootstrap-v11/r-03 | tr -d '\r\n'
            tr -d '\r\n' < bootstrap-v11/r-04
          } > /tmp/v11.b64
          base64 --decode --ignore-garbage /tmp/v11.b64 > /tmp/v11.tar.xz
          echo 'bf188d5d8564131f169a11b79da4e684afd2b391f574e4ed83388e06d9a0130f  /tmp/v11.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v11.tar.xz -C .
          test -f lib/censoredplanet.mjs
          test -f lib/globalping.mjs
          test -f lib/ripestat.mjs
          test -f data/intelligence-sources.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and checks
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=bootstrap-v11 \
            --exclude='.env.example' \
            'cfa[t]_[A-Za-z0-9_-]{20,}' .; then
            echo 'Potential Cloudflare API token committed to repository.' >&2
            exit 1
          fi
          if find . -maxdepth 3 -type f -name '.env' -print -quit | grep -q .; then
            echo 'A .env file is committed or present in the CI checkout.' >&2
            exit 1
          fi

      - name: Smoke-test production server
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/iran-monitor.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/tmp/health.json; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/does-not-exist)" = '404'
          cat /tmp/health.json

      - name: Commit verified v1.1 source
        if: ${{ hashFiles('bootstrap-v11/c-00') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap-v11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/ci.yml'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No v1.1 source changes staged.' >&2; exit 1; }
          git commit -m 'Implement v1.1 censorship intelligence expansion'
          git push origin HEAD:develop/v1.1
