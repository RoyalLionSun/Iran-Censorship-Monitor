name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify normalized transport chunks
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < bootstrap-v11/c-00 > /tmp/c-00
          echo '13e3364f7ee6a7262994c828f17386b9d74a6650a93428520b6b8b24621770d6  /tmp/c-00' | sha256sum -c -
          echo 'a593c1eb69e9953b2c7955417630f6bc93f1ed6d5568297a793f09cacdd135e2  bootstrap-v11/c-01' | sha256sum -c -
          echo 'ca140973194679b4cb413b82c7dfb8715fe677e67278b6faab84d6b353f2e209  bootstrap-v11/r-01' | sha256sum -c -
          echo 'e20f0a4f736df8193d88bd3efd5bfc2905a01ab88b20300f5d943e755cbfb803  bootstrap-v11/r-02' | sha256sum -c -
          head -c 15000 bootstrap-v11/r-03 > /tmp/r-03
          echo '3f5b93c48e6a7e72965f1c2e7473827863f578540eacf54e4884f6ffc865f677  /tmp/r-03' | sha256sum -c -
          echo '60ba5ebf2a12bf5d7fb82d41133f81b97c181f71141d1347855a5e0502c132ec  bootstrap-v11/r-04' | sha256sum -c -
          echo '--- r00 diagnostic ---'
          split -b 4000 -d -a 1 bootstrap-v11/r-00 /tmp/r00-
          sha256sum /tmp/r00-*
