name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify 500-byte repair fragments
        shell: bash
        run: |
          set -euo pipefail
          for f in bootstrap-v11/fix3-c00-0a bootstrap-v11/fix3-c00-0b bootstrap-v11/fix3-c00-0c bootstrap-v11/fix3-c00-0d bootstrap-v11/fix3-r00-2b-a bootstrap-v11/fix3-r00-2b-b bootstrap-v11/fix3-r00-2b-c bootstrap-v11/fix3-r00-2b-d; do
            tr -d '\r\n' < "$f" > "/tmp/$(basename "$f")"
          done
          echo 'a266bce3620c171cbca68f92a6c5e831b5de1a5753fdd1d5a382e73377cb7f1a  /tmp/fix3-c00-0a' | sha256sum -c -
          echo 'c3ca8aa8d289c88bbea488306741db5ca6b48de700a9e3c808967e1dbb35df8d  /tmp/fix3-c00-0b' | sha256sum -c -
          echo 'ad56383c6c97e40798bbc0331533d8e581e92c81a3d6a098c1db524cfe11248b  /tmp/fix3-c00-0c' | sha256sum -c -
          echo 'c34df3539676bcd2fe6627056ce92454c243a863bd212c61d7cc95bad61ba277  /tmp/fix3-c00-0d' | sha256sum -c -
          echo '582236685a5293c155ca4b4de9974ea2d820b4ba67c5a40c936c6fcee6d5b05c  /tmp/fix3-r00-2b-a' | sha256sum -c -
          echo 'ba19407b2f0dad7b91b877a648bd1f7f1ce0bff2ff86711995a29d06291d5d7c  /tmp/fix3-r00-2b-b' | sha256sum -c -
          echo '4e0ced1b2714fe842cd06a11e9199360d09899fbb187ec12531cb6e162f0b39a  /tmp/fix3-r00-2b-c' | sha256sum -c -
          echo 'e5ed9329469242a7ba8ad8797bc2e66ef24ae6fc57319c39590bb47502cfa116  /tmp/fix3-r00-2b-d' | sha256sum -c -
