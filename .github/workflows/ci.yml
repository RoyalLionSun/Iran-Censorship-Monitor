name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify repair chunk hashes
        shell: bash
        run: |
          set -euo pipefail
          echo 'd90c05208a6020f0cbb52f56836fc68a35b1f72543c0da83d02b9717c8348526  bootstrap-v11/fix2-c00-0' | sha256sum -c -
          echo 'e8f076eba9652c2f6f5fcdc5e1ffb2cd426ef5a1f4cf95ead6f7e66a035cff4f  bootstrap-v11/fix2-c00-1' | sha256sum -c -
          echo '14fda6d7b7f1656da980fcc526830a5fc92d5cf9a0d96a64d156dac2cb3d13a9  bootstrap-v11/fix2-r00-2-0' | sha256sum -c -
          echo 'a6f81b3489a66b77e81c70b352eb43f054c22d26727ffcac5492df7b844f7749  bootstrap-v11/fix2-r00-2-1' | sha256sum -c -
